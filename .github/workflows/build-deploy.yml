name: Build and Deploy

on:
  pull_request:
    types: [closed]
    branches: [main]
  # Manual runs (Actions -> Run workflow, from main) intentionally skip the
  # change detection below: a dispatch always cuts a new patch version and
  # builds the image, even when the changed files are in the exclusion list.
  # The existing promote chain then opens the staging promotion PRs.
  workflow_dispatch:

# Serialize builds: each run derives the next version from the latest git
# tag, so overlapping runs (a dispatch next to a merge, or two quick merges)
# would race to push the same tag. Queued, never cancelled.
concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  version:
    # pull_request events reach this job only for merged PRs; a manual
    # dispatch carries no PR payload and must always proceed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # `code_changed` gates everything downstream: only application-code
    # changes produce a new version, image and promotion. Docs, tests and
    # infra-only merges reuse the latest tag and skip the docker job (see the
    # `changes` step for what counts as code). Manual dispatches force
    # `code_changed=true`: they always cut a new version.
    outputs:
      version: ${{ steps.version.outputs.version }}
      code_changed: ${{ steps.changes.outputs.code }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check for application code changes
        # The version (and therefore the image and the promotion) must only
        # move when the shipped application changes. Everything matching the
        # ignore patterns below -- tests, Docker/infra files, pipelines, docs,
        # toolchain pins -- never affects the built image, so a merge touching
        # only those reuses the latest tag instead of cutting a new version.
        # Anything NOT listed (src, public, package.json/lock, build configs,
        # VERSION.json, vendor) counts as application code.
        id: changes
        run: |
          # Manual dispatch: the operator explicitly asked for a build, so the
          # exclusion list does not apply and a new version is always cut (the
          # "and only when called manually" branch of the rule).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch -- forcing a new version (change detection skipped)."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # The SHAs come from the event payload and may postdate the
          # checkout: a force-push/amend replaces the head commit, leaving the
          # old object unreferenced so the checkout fetch never brings it.
          # Fetch both SHAs explicitly (GitHub serves arbitrary hashes); warn
          # and continue on fetch failure, the diff below is the real gate.
          git fetch --no-tags --quiet origin "$base" "$head" || echo "WARNING: explicit fetch of $base / $head failed, diffing with local objects"
          files=$(git diff --name-only "$base" "$head") || {
            echo "ERROR: cannot diff $base...$head even after explicit fetch; refusing to guess, failing closed."
            exit 1
          }
          code=false
          while IFS= read -r f; do
            # An empty file list still feeds this loop one empty line, and the
            # empty string matches the catch-all below. Without this guard a
            # failed-or-empty diff would silently read as code=true.
            [ -z "$f" ] && continue
            case "$f" in
              test/*|Dockerfile|docker-compose.yml|docker-entrypoint.sh|.dockerignore|.github/*|*.md) ;;
              *) code=true; break ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Application code changed: $code"

      - name: Read version and create tag
        id: version
        run: |
          major=$(jq -r '.major' VERSION.json)
          minor=$(jq -r '.minor' VERSION.json)

          latest=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          if [ "${{ steps.changes.outputs.code }}" = "true" ]; then
            current_patch=$(echo "$latest" | cut -d. -f3)
            new_patch=${current_patch:-0}
            new_patch=$((new_patch + 1))

            new_version="v${major}.${minor}.${new_patch}"
            echo "version=$new_version" >> $GITHUB_OUTPUT
            echo "New version: $new_version"
          else
            echo "version=v$latest" >> $GITHUB_OUTPUT
            echo "Docs/infra-only change -- reusing latest tag v$latest, no new version."
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: steps.changes.outputs.code == 'true'
        run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

  docker:
    needs: version
    # No new version, no new image: docs/infra-only merges end in the
    # `version` job above (green, but without tag or image).
    if: needs.version.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.version }}
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{ version }},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{ major }}.{{ minor }}
            type=semver,pattern={{ major }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
