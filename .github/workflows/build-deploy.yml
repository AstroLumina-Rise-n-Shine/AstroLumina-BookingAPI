name: Build and Deploy

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # `code_changed` gates everything downstream: only application-code
    # changes produce a new version, image and promotion. Docs, tests and
    # infra-only merges reuse the latest tag and skip the docker job (see the
    # `changes` step for what counts as code).
    outputs:
      version: ${{ steps.version.outputs.version }}
      code_changed: ${{ steps.changes.outputs.code }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check for application code changes
        # The version (and therefore the image and the promotion) must only
        # move when the shipped application changes. Everything matching the
        # ignore patterns below -- tests, Docker/infra files, pipelines, docs,
        # toolchain pins -- never affects the built image, so a merge touching
        # only those reuses the latest tag instead of cutting a new version.
        # Anything NOT listed (src, public, package.json/lock, build configs,
        # VERSION.json, vendor) counts as application code.
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          code=false
          while IFS= read -r f; do
            case "$f" in
              test/*|Dockerfile|docker-compose.yml|docker-entrypoint.sh|nginx.conf|.dockerignore|.github/*|*.md|eslint.config.js|.nvmrc|wrangler.toml) ;;
              *) code=true; break ;;
            esac
          done <<< "$(git diff --name-only "$base" "$head")"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Application code changed: $code"

      - name: Read version and create tag
        id: version
        run: |
          major=$(jq -r '.major' VERSION.json)
          minor=$(jq -r '.minor' VERSION.json)

          latest=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          if [ "${{ steps.changes.outputs.code }}" = "true" ]; then
            current_patch=$(echo "$latest" | cut -d. -f3)
            new_patch=${current_patch:-0}
            new_patch=$((new_patch + 1))

            new_version="v${major}.${minor}.${new_patch}"
            echo "version=$new_version" >> $GITHUB_OUTPUT
            echo "New version: $new_version"
          else
            echo "version=v$latest" >> $GITHUB_OUTPUT
            echo "Docs/infra-only change -- reusing latest tag v$latest, no new version."
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: steps.changes.outputs.code == 'true'
        run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

  docker:
    needs: version
    # No new version, no new image: docs/infra-only merges end in the
    # `version` job above (green, but without tag or image).
    if: needs.version.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.version }}
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{ version }},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{ major }}.{{ minor }}
            type=semver,pattern={{ major }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
