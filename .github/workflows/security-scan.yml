# =============================================================================
# AstroLumina BookingAPI — Security Scan
#
# Three pillars of vulnerability scanning:
#   1. STATIC  (SAST + SCA) — Semgrep scans the source; npm audit + Trivy
#      (fs mode) scan dependencies, secrets and misconfigurations. CodeQL
#      itself runs through the repo's DEFAULT setup (automatic) — GitHub
#      rejects advanced-setup SARIF uploads while default setup is enabled,
#      so this workflow intentionally contains no CodeQL init/analyze job.
#      To switch to advanced CodeQL, enable it under Settings → Code
#      security and re-add the init/autobuild/analyze job.
#   2. DOCKER  — the production image is built locally (no push) and scanned
#      with Trivy (OS + library vulnerabilities, misconfigurations, secrets).
#   3. DYNAMIC (DAST) — the API is booted with dummy (non-secret) env values
#      and scanned with an OWASP ZAP baseline scan (spider + passive rules).
#
# All SARIF results are uploaded to GitHub code scanning, so findings show up
# under the repository's "Security" tab and as PR annotations.
#
# NOTE (private repos): the Security tab requires GitHub Advanced
# Security (GHAS). Without it, SARIF uploads are skipped by GitHub —
# Semgrep / npm audit / Trivy / ZAP results (logs + artifacts) still work.
#
# The workflow is BLOCKING: Semgrep (--error), npm audit (--audit-level=moderate),
# Trivy (exit-code: 1 on CRITICAL,HIGH) and the ZAP baseline (-I, failures only)
# all fail the job on findings. The scans are intended to be enforced as
# required status checks for merges to main.
# =============================================================================

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 06:00 UTC — catches newly disclosed CVEs in old code.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1a. STATIC — Semgrep (rule-based SAST, works with or without GHAS)
  # ─────────────────────────────────────────────────────────────────────────
  sast-semgrep:
    name: SAST / Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: |
          python -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install --quiet semgrep

      - name: Semgrep scan (blocking)
        # Explicit ruleset `p/default`: `--config auto` refuses to run with
        # metrics off, and metrics stay off here. With `--error` any finding
        # fails the step.
        env:
          SEMGREP_SEND_METRICS: off
        run: /tmp/semgrep-venv/bin/semgrep scan --config p/default --error --sarif --output semgrep.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ─────────────────────────────────────────────────────────────────────────
  # 1b. STATIC — Software Composition Analysis (dependencies, secrets, IaC)
  # ─────────────────────────────────────────────────────────────────────────
  sca:
    name: SCA / npm audit + Trivy repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm audit (blocking)
        run: npm audit --audit-level=moderate

      - name: npm audit report (always generated for the artifact)
        if: always()
        run: |
          npm audit --audit-level=moderate --json > npm-audit.json || true

      - name: Upload npm audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 30

      - name: Trivy repo scan — vuln, secrets, misconfig (blocking)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0, SHA-pinned (supply-chain safety)
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: 'true'
          format: sarif
          output: trivy-fs.sarif
          exit-code: "1"

      - name: Upload Trivy repo SARIF to code scanning
        uses: github/codeql-action/upload-sarif@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ─────────────────────────────────────────────────────────────────────────
  # 2. DOCKER — build the production image, scan it with Trivy
  # ─────────────────────────────────────────────────────────────────────────
  docker-scan:
    name: Docker / Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (local only, no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          load: true
          tags: booking-api:security-scan

      - name: Trivy image scan (blocking)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0, SHA-pinned (supply-chain safety)
        with:
          scan-type: image
          image-ref: booking-api:security-scan
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: 'true'
          format: sarif
          output: trivy-image.sarif
          exit-code: "1"

      - name: Upload Trivy image SARIF to code scanning
        uses: github/codeql-action/upload-sarif@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ─────────────────────────────────────────────────────────────────────────
  # 3. DYNAMIC — boot the API, run OWASP ZAP baseline scan against it
  #
  # The app validates env strictly (zod) but never calls Cal.com/Resend/
  # R2/D1/Sentry at boot, so syntactically-valid dummy values are enough
  # for a baseline crawl of: GET /, GET /health, 404 handling.
  # ─────────────────────────────────────────────────────────────────────────
  dast-zap:
    name: DAST / OWASP ZAP baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_ENV: development
      BOOKING_API_SERVER_PORT: "3102"
      # Dummy but URL-valid DSN — SDK init succeeds, events go nowhere.
      BOOKING_API_SENTRY_DSN: https://00000000000000000000000000000000@o0.ingest.sentry.io/0
      # Dummy Booking values — satisfy the zod schema; no external call possible.
      RESEND_API_KEY: dummy_key_for_ci_scan_only
      CALCOM_API_KEY: dummy_key_for_ci_scan_only
      CALCOM_BASE_URL: https://ci.local
      R2_BASE_URL: https://ci.local
      D1_ACCOUNT_ID: dummy_account_for_ci_scan_only
      D1_DATABASE_ID: dummy_database_for_ci_scan_only
      D1_API_TOKEN: dummy_token_for_ci_scan_only
      # Dummy CORS endpoint pairs — only schema validation; no traffic.
      ASTROLOGY_API_SERVER_DC_PORT: "3101"
      ASTROLOGY_API_SERVER_DC_DNS: ci.local
      ASTROLOGY_API_SERVER_K8S_PORT: "3101"
      ASTROLOGY_API_SERVER_K8S_DNS: ci.local
      BOOKING_API_SERVER_DC_PORT: "3102"
      BOOKING_API_SERVER_DC_DNS: ci.local
      BOOKING_API_SERVER_K8S_PORT: "3102"
      BOOKING_API_SERVER_K8S_DNS: ci.local
      PAYMENT_API_SERVER_DC_PORT: "3000"
      PAYMENT_API_SERVER_DC_DNS: ci.local
      PAYMENT_API_SERVER_K8S_PORT: "3000"
      PAYMENT_API_SERVER_K8S_DNS: ci.local
      FRONTEND_SERVER_DC_PORT: "3103"
      FRONTEND_SERVER_DC_DNS: ci.local
      FRONTEND_SERVER_K8S_PORT: "3103"
      FRONTEND_SERVER_K8S_DNS: ci.local
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start API and wait for health
        run: |
          node dist/server.js > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 30); do
            if curl -fs "http://localhost:${BOOKING_API_SERVER_PORT}/health" > /dev/null; then
              echo "API is up on port ${BOOKING_API_SERVER_PORT}"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start — log:"
          cat api.log
          exit 1

      - name: OWASP ZAP baseline scan (blocking)
        # ZAP exits non-zero on failures; `-I` keeps WARNINGS visible in the
        # report while only FAILs block the job.
        # --network host lets the ZAP container reach the API on localhost.
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -I \
              -t "http://localhost:${BOOKING_API_SERVER_PORT}" \
              -r baseline-report.html \
              -J baseline-report.json

      - name: Stop API
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true

      - name: Upload ZAP reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zap-baseline-reports
          path: zap-reports/
          retention-days: 30
